<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>tests</title>
<style>body{font:13px monospace} .fail{color:#c00}</style>
</head>
<body>
<p id="summary">running…</p>
<ul id="results"></ul>
<script type="module">
import { run } from "./harness.js";
const files = ["./date.test.js", "./shift.test.js", "./tide-name.test.js", "./tide-data.test.js", "./weather.test.js", "./store.test.js", "./esc.test.js", "./fix.test.js", "./config.test.js", "./ui.test.js"];
try {
  for (const f of files) await import(f);
} catch (err) {
  document.getElementById("summary").textContent = `FAIL load error: ${err.message}`;
  throw err;
}
await run();
</script>
</body>
